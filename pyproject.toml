[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remember-backup"
version = "0.1.0"
description = "Config-free SFTP and local backup tools for the Remember watch recorder"
readme = "docs/cli.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["paramiko>=5.0,<6"]

[project.scripts]
remember = "remember_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "tools"}
packages = ["remember_cli"]
